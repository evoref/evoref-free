# LiquidAI LFM2 dense 系 (arch "lfm2"・非 MoE)。
# MoE 版 (LFM2-8B-A1B / LFM2.5-8B-A1B) は別アーキ "lfm2moe" を報告するため
# lfm2moe.yaml 側で扱う (sampling 等もそちらが本命)。
#
# dense 版の推奨 sampling は公式に明示が無いため空にし、mode 別 (modes.*) の
# 設定に委ねる。内蔵 ChatML テンプレートを使うため --jinja のみ付与する。
launch_flags:
  - "--jinja"
  - "--reasoning-format"
  - "auto"
# context_size (-c)。LFM2 dense の学習時最大コンテキスト (n_ctx_train) = 32768。
# config.yaml の llama.context_size が未指定 / null のとき採用される
# (解決順: config 明示 > profile > 8192)。32768 を超える拡張は RoPE スケーリングが必要。
# 32768 は KV キャッシュ VRAM が 8192 比で約4倍。VRAM が厳しい場合は config 側で
# context_size を明示 (8192 等) して上書きするか cache_type_k/v を量子化する。
context_size: 32768
moe:
  enabled: false
  n_cpu_moe: null
sampling: {}
# reasoning (thinking)。dense LFM2 は非 reasoning 想定 (mode: none)。
# enable_thinking / reasoning_budget を送らない (HTTP 400 回避)。
reasoning:
  mode: none
# LFM2.5-Embedding-350M (arch "lfm2") の埋め込みプロファイル。embed モデルを本 arch へ
# 切替えたとき ModelMigrator がここを config.yaml の embedding.* へ転写する
# (query_template/doc_template/instructions/max_length/context_size)。dim は GGUF の
# embedding_length、model_name は GGUF stem から取るためここには置かない。生成パス
# (sampling/reasoning/上の context_size) とは独立・無干渉 (別コードパスが読む)。
# LFM2.5-Embedding は固定 prefix・非対称・非 instruction-aware: query 側 "query: "、
# document 側 "document: " (末尾スペース込)。出力は L2 正規化・推奨入力長 512 トークン。
# instructions はテンプレに {task} が無く挿入されないが、resolve_instruction が eager
# に呼ばれ空 dict だと毎 embed で WARNING を吐くためダミー文で埋める (出力には無影響)。
# max_length は「1 入力シーケンスの推奨上限」= 512 (client が各テキストを clamp)。
# context_size / batch_size / ubatch_size はサーバ側リソース (KV/バッチ) でモデル固有では
# なく、embed サーバは並列スロットで動くため context は max_length × スロット数を要する。
# ここで 512 に絞るとスロット分割で per-slot が不足し KV 確保に失敗してサーバが crash する
# (GGML_ASSERT)。よって profile では設定せず config/schema 既定 (8192) に委ねる。
embedding:
  query_template: "query: {query}"
  doc_template: "document: {query}"
  instructions:
    chat: "Retrieve relevant passages for the query."
    coding: "Retrieve relevant code for the query."
  max_length: 512
