# BAAI/bge-m3 (arch "bert")。
# llama.cpp の convert_hf_to_gguf.py は XLMRobertaModel を MODEL_ARCH.BERT として
# 変換するため、bge-m3 の GGUF (例: ggml-org/bge-m3-Q8_0-GGUF) は
# general.architecture="bert" を報告する想定。
#
# bert arch は embed 専用プロファイル。BERT/XLM-RoBERTa は encoder-only で
# 自己回帰生成ができず、base/assist モデルとして使われることは無い。よって
# 他プロファイル (qwen3.yaml 等) と異なり launch_flags / moe / sampling /
# reasoning は定義しない (これらを読む resolve_auto_model_flags 等は base
# モデルパス経由でのみ呼ばれ、embed モデル切替では参照されないため)。
#
# BGE-M3 (arch "bert") の埋め込みプロファイル。embed モデルを本 arch へ
# 切替えたとき ModelMigrator がここを config.yaml の embedding.* へ転写する。
# dim (1024) は GGUF の embedding_length、model_name は GGUF stem から取る
# ためここには置かない。
embedding:
  # BGE-M3 は非 instruction-aware: 公式モデルカードは query/doc とも raw text
  # をそのまま投入する設計を明記しており prefix 不要。instructions キーは
  # 置かない (query_template/doc_template が両方空文字列のため
  # instruction_resolver::format_with_instruction の空文字列 fast-path が効き
  # resolve_instruction は一度も呼ばれない)。
  query_template: ""
  doc_template: ""
  # 1 入力シーケンスの推奨上限 (公式モデルカード記載の最大コンテキスト長)。
  max_length: 8192
  # Pooling 方式。BERT/XLM-RoBERTa 系の慣例である CLS pooling が正しい
  # (Qwen3-Embedding の last-token pooling とは異なる)。GGUF の
  # pooling_type メタデータに実行時判定を委ねず、build_embed_cmd が
  # --pooling cls を明示付与する (誤 pooling による embedding 品質劣化を防ぐ)。
  pooling: cls
  # recall (URL/コマンドリコールの sim 閾値)。実機の稼働中 bge-m3 サーバ +
  # 実際の SemMem fact (URL 11件・executable_command 7件) で実測較正した値。
  # BGE-M3 は instruction prefix 無しの生埋め込みのため、短い日本語疑問文
  # 同士は話題が無関係でも文の型が似ているだけで sim 0.5-0.6 台が出やすく、
  # 正例 (言い換えレベル: 0.51-0.67) と雑音 (0.40-0.59) の分布が重なる
  # (Qwen3/LFM2.5 のようにきれいに分離しない)。明確に分離できるのは
  # ほぼ同一文の再質問 (0.90 台) のみ。雑音側の最大観測値 (0.59) に安全
  # マージンを載せた 0.65 を採用: 誤引き当てを防ぐ代わりに、言い換え
  # レベルの正例 (例: fifa.com 0.65-0.67, liquid.ai 0.52) は拾えなくなる
  # トレードオフを許容する。
  # 2026-08-30 再測定 (敵対的な雑音集合 = 短い日本語疑問文 18 件を含む
  # 話題 12 / 正例 16 / 雑音 18 で、3 モデルを同一条件で比較):
  #
  #   誤発火 0 を保てる最良閾値と、そのときの正例通過数
  #     LFM2.5-Embedding-350M  0.701 →  3/16
  #     Qwen3-Embedding-0.6B   0.764 →  5/16
  #     BGE-M3                 0.696 → 12/16   ← 最良
  #
  # 旧コメントは「BGE-M3 は問い↔問いで分離しない」としていたが、雑音側を
  # 短い疑問文で敵対的にすると **現行 LFM2.5 の方がはるかに悪い** (3/16)。
  # BGE-M3 は 0.65 では雑音が 4/18 通ってしまうため、雑音側の上限を超える
  # 0.70 へ引き上げる (12/16 通過・誤発火 0)。
  recall:
    url_recall_min_score: 0.70
    executable_command_recall_min_score: 0.70
  # コサインを絶対値で比べる閾値 (config の memory.* / rag.* へ転写)。
  #
  # 2026-08-30 実測 (LFM2.5 / Qwen3 / bge-m3 を同一ペアで比較):
  #
  #   真の競合 (同一スロットの別世代) 0.559-0.926 (中央 0.775)
  #   偽の競合 (別スロット同士)       0.399-0.506 (中央 0.459)
  #   関連ノート                     0.555-0.804 (中央 0.694)
  #   無関係ノート                   0.357-0.471 (中央 0.387)
  #
  # BGE-M3 は無関係ペアでも 0.36-0.51 に載る (LFM2.5 は 0.04-0.15)。
  # 絶対値で比べる閾値は **必ずこの底上げを織り込む** 必要がある。
  #
  # note_link: 現行既定 0.5 でも誤検出 0 だが、無関係の最大 0.471 との余裕が
  # 0.029 しかない。関連の最小 0.555 との中間 0.52 を採る。
  # attribute: 0.55 で正例 5/5・誤検出 0/6。据え置き。
  # conflict/merge: 0.85 は真の競合を 1/5 しか拾えない (これは全モデル共通の
  # 別課題)。BGE-M3 の分布では 0.53 が真偽の中間だが、誤マージは破壊的なので
  # 保守的に既定の 0.85 を据え置く。
  # cartridge_gate: 0.3 は **BGE-M3 では全件が超える** (無関係ペアの中央 0.459)
  # ためゲートが常時開放になる。無関係側の上限 0.51 を超える 0.55 を採る。
  memory:
    note_link_threshold: 0.52
    conflict_similarity_threshold: 0.85
    attribute_similarity_threshold: 0.55
  rag:
    cartridge_gate_threshold: 0.55
