# BAAI/bge-m3 (arch "bert")。
# llama.cpp の convert_hf_to_gguf.py は XLMRobertaModel を MODEL_ARCH.BERT として
# 変換するため、bge-m3 の GGUF (例: ggml-org/bge-m3-Q8_0-GGUF) は
# general.architecture="bert" を報告する想定。
#
# bert arch は embed 専用プロファイル。BERT/XLM-RoBERTa は encoder-only で
# 自己回帰生成ができず、base/assist モデルとして使われることは無い。よって
# 他プロファイル (qwen3.yaml 等) と異なり launch_flags / moe / sampling /
# reasoning は定義しない (これらを読む resolve_auto_model_flags 等は base
# モデルパス経由でのみ呼ばれ、embed モデル切替では参照されないため)。
#
# BGE-M3 (arch "bert") の埋め込みプロファイル。embed モデルを本 arch へ
# 切替えたとき ModelMigrator がここを config.yaml の embedding.* へ転写する。
# dim (1024) は GGUF の embedding_length、model_name は GGUF stem から取る
# ためここには置かない。
embedding:
  # BGE-M3 は非 instruction-aware: 公式モデルカードは query/doc とも raw text
  # をそのまま投入する設計を明記しており prefix 不要。instructions キーは
  # 置かない (query_template/doc_template が両方空文字列のため
  # instruction_resolver::format_with_instruction の空文字列 fast-path が効き
  # resolve_instruction は一度も呼ばれない)。
  query_template: ""
  doc_template: ""
  # 1 入力シーケンスの推奨上限 (公式モデルカード記載の最大コンテキスト長)。
  max_length: 8192
  # Pooling 方式。BERT/XLM-RoBERTa 系の慣例である CLS pooling が正しい
  # (Qwen3-Embedding の last-token pooling とは異なる)。GGUF の
  # pooling_type メタデータに実行時判定を委ねず、build_embed_cmd が
  # --pooling cls を明示付与する (誤 pooling による embedding 品質劣化を防ぐ)。
  pooling: cls
  # ── 実測較正 (2026-08-30) ─────────────────────────────────────
  # 3 モデル (LFM2.5-Embedding-350M / Qwen3-Embedding-0.6B / BGE-M3) を
  # **同一データ・同一手順** で測って導いた。測定対象はコード上の実際の
  # 比較対象に合わせてある:
  #
  #   url / executable_command … クエリ ↔ 保存済み話題
  #   note_link / conflict      … STM ノート ↔ ノート
  #   min_merge                 … 同上 (LLM 統合を行う上位の閾値)
  #   attribute_similarity      … 同一 (subject,predicate) 内のファクト object 同士
  #   cartridge_gate            … クエリ ↔ カートリッジ **重心**
  #
  # 閾値はゲートごとのコスト非対称性で選定した。外部作用を伴うもの
  # (URL 取得 / コマンド実行 / 誤マージ / 偽の競合) は **誤検出 0** を要求し、
  # コストが余分な検索・LLM 呼び出しに留まるものは取りこぼしを減らす側へ寄せた。
  #
  # データは合成セット (話題 8 / 正例 13-14 / 雑音 20、ノート対 10+12、
  # ファクト対 8+10、カートリッジ 3 x 6 チャンク)。実ストアではない点に注意。
  #
  # ⚠ 再較正でこの値を変えるときは scripts/tests/test_launch_llama_profiles.py の
  #   _CALIBRATED_THRESHOLDS も同じコミットで更新すること (更新漏れは同テストが検知する)。
  recall:
    # 11/14 通過・誤検出 0/20
    url_recall_min_score: 0.68
    # 5/13 通過・誤検出 0/20
    executable_command_recall_min_score: 0.74
  memory:
    # 10/10 通過・誤検出 0/12
    note_link_threshold: 0.48
    # 8/10 通過・誤検出 1/22
    conflict_similarity_threshold: 0.83
    # 7/10 通過・誤検出 0/22
    min_merge_similarity: 0.84
    # 7/8 通過・誤検出 0/10
    attribute_similarity_threshold: 0.67
  rag:
    # 2026-08 較正: 0.53 で 9/9 通過・誤検出 1/8。
    # 2026-09-07 実機 A/B (合成 8 文書パッケージ + 個人事実 20 ターン): 0.53 は
    # 6/8 通過・誤検出 0/12、0.45 は 7/8・0/12、0.40 は 8/8・0/12。Evidence Store
    # では重心ゲート通過後にチャンク単位の cosine ゲート (較正値 ≈0.50) が掛かる
    # ので、重心の誤通過の実害は小さく、取りこぼしの方が高くつく。0.45 へ緩める。
    cartridge_gate_threshold: 0.45
    # MemoryInjector の関連度ゲート (クエリ ↔ ファクト / ノート) の静的値。
    # 較正 (memory_threshold_calibration、ノート 30 件以上で背景 p95 を導出) が
    # 効くまでの間に使う。2026-08-30 実測 (実ファクト 15 件 × 想起クエリ 35 件):
    # 正解 p25 0.594 / 背景 p95 0.542 → 較正式 (背景 p95) と同じ 0.54。
    # LFM2.5 前提の 0.35 は bge-m3 のノイズ床 (無関係ペア 0.29〜0.47) を下回り、
    # リセット直後は全ファクトが全ターンに載る (2026-09-09 ライブ監査 (d) D-03)。
    injection_relevance_min_score: 0.54
