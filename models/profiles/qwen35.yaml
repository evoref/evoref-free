# Qwen3.5 dense 系 (arch "qwen35"・非 MoE)。
#
# Qwen3.5-9B / Qwen3.5-4B 等の GGUF は general.architecture="qwen35" を報告するため、
# qwen3.yaml ではマッチしない。dense Qwen3 系と挙動は同一だが、arch 名一致のため
# 専用プロファイルが必要 (cf. lfm2 と lfm2moe の分離)。
#
# sampling は意図的に空: プロファイル sampling は modes.* を上書きするため、
# ここで値を入れると chat (temp 0.7) と coding (temp 0.3) のモード別チューニングを
# 一律に潰してしまう。Qwen3 系はモード別の温度差が有効なので modes.* に委ねる。
#
# dense なので MoE 無効。内蔵テンプレートを使うため --jinja を付与。
launch_flags:
  - "--jinja"
  - "--reasoning-format"
  - "auto"
moe:
  enabled: false
  n_cpu_moe: null
sampling: {}
# reasoning (thinking)。mode は toggle (enable_thinking で ON/OFF 可) / always
# (常時思考・OFF 不可、例 DeepSeek-R1) / none (非対応) の3値。
# toggle/always のみ reasoning_budget を送信、toggle のみ enable_thinking を送信する
# (非対応 arch には送らず HTTP 400 回避)。enable_thinking は config
# (llama.enable_thinking / assist の chat_template_kwargs) 未指定時の既定値。
# Qwen3.5 は thinking 切替対応 (toggle)・既定 OFF (速度優先)。
reasoning:
  mode: toggle
  enable_thinking: false
