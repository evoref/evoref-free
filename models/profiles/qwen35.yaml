# Qwen3.5 dense 系 (arch "qwen35"・非 MoE)。
#
# Qwen3.5-9B / Qwen3.5-4B 等の GGUF は general.architecture="qwen35" を報告するため、
# qwen3.yaml ではマッチしない。dense Qwen3 系と挙動は同一だが、arch 名一致のため
# 専用プロファイルが必要 (cf. lfm2 と lfm2moe の分離)。
#
# sampling は意図的に空: プロファイル sampling は modes.* を上書きするため、
# ここで値を入れると chat (temp 0.7) と create (temp 0.3) のモード別チューニングを
# 一律に潰してしまう。Qwen3 系はモード別の温度差が有効なので modes.* に委ねる。
#
# dense なので MoE 無効。内蔵テンプレートを使うため --jinja を付与。
launch_flags:
  - "--jinja"
  - "--reasoning-format"
  - "auto"
# context_size (-c)。**モデルの上限ではなく VRAM 都合の保守既定**。
# 実測 (2026-08-15) では Qwen3.5-27B / 9B / Qwen3.8-27B いずれも GGUF の
# n_ctx_train (<arch>.context_length) = 262144 で、32768 はその 1/8 に留めた値。
# config.yaml の llama.context_size が未指定 / null のとき採用される
# (解決順: config 明示 > profile > 8192)。262144 を超える拡張は YaRN/RoPE 必須。
# 32768 は KV キャッシュ VRAM が 8192 比で約4倍。VRAM が厳しい場合は config 側で
# context_size を明示 (8192 等) して上書きするか cache_type_k/v を量子化する。
#
# なお本 arch は full attention と Gated DeltaNet の hybrid で
# (<arch>.full_attention_interval=4 → 4 層に 1 層だけが KV を持つ)、
# 残り 3/4 の層は文脈長に依存しない固定長の再帰状態を持つ。同じ層数の
# 純 attention モデルより文脈メモリは軽い (推定式は scripts/launch_llama.py の
# estimate_kv_cache_mb)。
context_size: 32768
moe:
  enabled: false
  n_cpu_moe: null
sampling: {}
# reasoning (thinking)。mode は toggle (enable_thinking で ON/OFF 可) / always
# (常時思考・OFF 不可、例 DeepSeek-R1) / none (非対応) の3値。
# toggle/always のみ reasoning_budget を送信、toggle のみ enable_thinking を送信する
# (非対応 arch には送らず HTTP 400 回避)。enable_thinking は config
# (llama.enable_thinking / assist の chat_template_kwargs) 未指定時の既定値。
# Qwen3.5 は thinking 切替対応 (toggle)・既定 OFF (速度優先)。
reasoning:
  mode: toggle
  enable_thinking: false
  server_control: true        # Qwen3.5 系は llama.cpp 認識 (thinking != 0) → サーバ側 reasoning 制御可
  reasoning_format: auto      # 認識モデルは auto で <think> を reasoning_content に分離
  budget_default: -1
