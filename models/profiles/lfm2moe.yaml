# LiquidAI LFM2.5-8B-A1B / LFM2-8B-A1B (arch "lfm2moe"・MoE・reasoning)。
# GGUF の general.architecture が "lfm2moe" を報告するためファイル名も lfm2moe。
# (dense 版 LFM2 は別アーキ "lfm2" → lfm2.yaml で扱う)
#
# 推奨 sampling はモデルカード準拠: temperature 0.2 / top_k 80 / repetition_penalty 1.05。
# モデルカードは top_p / min_p / presence_penalty を推奨しないため設定しない
# (それらは mode 既定値がそのまま使われる)。
#
# MoE オフロードは既定で付けない (n_cpu_moe: null)。8.3B総/1.5Bアクティブで多くの GPU に
# 収まるため。VRAM が厳しい場合は local/profiles/lfm2moe.yaml で moe.n_cpu_moe を
# 整数指定すると expert を CPU 退避できる。
launch_flags:
  - "--jinja"
  - "--reasoning-format"
  - "auto"
# context_size (-c)。LFM2.5-8B-A1B / LFM2-8B-A1B の学習時最大コンテキスト (n_ctx_train) = 32768。
# config.yaml の llama.context_size が未指定 / null のとき採用される
# (解決順: config 明示 > profile > 8192)。32768 を超える拡張は RoPE スケーリングが必要。
# 32768 は KV キャッシュ VRAM が 8192 比で約4倍。VRAM が厳しい場合は config 側で
# context_size を明示 (8192 等) して上書きするか cache_type_k/v を量子化する。
context_size: 32768
moe:
  enabled: true
  n_cpu_moe: null
sampling:
  temperature: 0.2
  top_k: 80
  repetition_penalty: 1.05
# reasoning (thinking)。LFM2.5-8B-A1B は OFF スイッチ無しの強制 reasoning モデル。
# 実機検証 (c_15 Step0) で llama.cpp が thinking=0 (peg-native) で reasoning 領域を認識せず、
# --reasoning-format / --reasoning-budget / -rea が全て no-op であることが確定。
# よって server_control: false とし、思考はクライアント側 (_ReasoningFilter) で除去する。
reasoning:
  mode: always
  server_control: false      # llama.cpp 非認識 (thinking=0) → サーバ側 reasoning 制御不可 (Step0 実証)
  client_handling: strip     # <think> を回答から除去 (隠す)
  marker_style: think_tags
  client_think_budget: 4096  # watchdog 上限。LFM2.5 は難問で思考が 1000+ tok に達してから </think> を閉じるため、512 では回答到達前に stream 中断 (content 0) していた (実機実測)
  on_runaway: fallback
  exclude_from_history: true # 思考を履歴/WM に残さない (多ターン汚染防止)
