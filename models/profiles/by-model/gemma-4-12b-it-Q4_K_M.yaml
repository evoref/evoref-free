# gemma-4-12b-it-Q4_K_M 固有のプロファイル (models/profiles/gemma4.yaml への差分)。
#
# ファイル名は GGUF ファイル名の拡張子なし部分と完全一致させる。書いたキーだけが
# arch プロファイルへ deep merge で上書きされ、書かないキーは arch から継承する。
# ``launch_flags`` のような list は連結ではなく置換なので、上書きするなら arch 側の
# 値も含めて全部書くこと。``-c`` / ``-ngl`` 等 builder が固定出力するフラグを
# ``launch_flags`` に書いても除去されるので ``context_size:`` を使う。
# プロファイルの変更は llama-server / backend の再起動で反映される。
#
# 実測 (2026-08-02〜03): 日本語の語間空白の混入率 76〜83%。同じ計測で
# Qwen3.5-9B-Q4_K_M は 1%、同 arch の gemma-4-E2B_q4_0-it は 0%、
# gemma-4-26B-A4B-it-UD-Q4_K_M は 0.0 だった。temperature=0.0 の貪欲法でも再現する
# ためサンプリング設定では回避できず、事実誤認 (日本三景を富士山と答える等) や
# トークンレベルの崩れも同時に現れる。閾値は緩めず known_issues で先に伝える
# (閾値を緩めて隠すのは本末転倒)。実際の可否は起動時プローブの実測値で判断すること。
quality_baseline:
  known_issues:
    - "日本語の語間に半角空白が混入する (実測 76〜83%、temperature=0.0 でも再現)"
    - "日本語での事実性も低下する傾向 (語間空白と同時に観測)"
