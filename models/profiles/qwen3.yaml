# Qwen3 / Qwen3.5 dense 系 (arch "qwen3"・非 MoE)。
#
# sampling は意図的に空にする: プロファイル sampling は modes.* を上書きするため、
# ここで値を入れると chat (temp 0.7) と create (temp 0.3) のモード別チューニングを
# 一律に潰してしまう。Qwen3 はモード別の温度差が有効なので modes.* に委ねるのが最適。
# (Qwen3 公式の非 thinking 推奨は temp 0.7 / top_p 0.8 / top_k 20 だが、単一 arch
#  プロファイルでは chat/create を区別できないため採用しない。)
#
# dense なので MoE 無効。内蔵テンプレートを使うため --jinja を付与。
launch_flags:
  - "--jinja"
  - "--reasoning-format"
  - "auto"
# context_size (-c)。Qwen3 dense の学習時最大コンテキスト (n_ctx_train) = 32768。
# config.yaml の llama.context_size が未指定 / null のとき採用される
# (解決順: config 明示 > profile > 8192)。32768 を超える拡張 (131072 等) は YaRN/RoPE 必須。
# 32768 は KV キャッシュ VRAM が 8192 比で約4倍。VRAM が厳しい場合は config 側で
# context_size を明示 (8192 等) して上書きするか cache_type_k/v を量子化する。
context_size: 32768
moe:
  enabled: false
  n_cpu_moe: null
sampling: {}
# reasoning (thinking)。Qwen3 は thinking 切替対応 (mode: toggle)・既定 OFF (速度優先)。
# mode の意味は qwen35.yaml のコメント参照。
reasoning:
  mode: toggle
  enable_thinking: false
  server_control: true        # Qwen3 系は llama.cpp 認識 (thinking != 0) → サーバ側 reasoning 制御可
  reasoning_format: auto      # 認識モデルは auto で <think> を reasoning_content に分離
  budget_default: -1
# Qwen3-Embedding-0.6B (arch "qwen3") の埋め込みプロファイル。embed モデルを本 arch へ
# 切替え (LFM2.5 からの戻し等) たとき ModelMigrator がここを config.yaml embedding.* へ
# 転写する。dim は GGUF、model_name は GGUF stem。生成パスとは独立・無干渉。
# Qwen3-Embedding は instruction-aware・query 側のみ prefix (doc は raw)。Free schema
# 既定 (backend/schemas/rag.py の EmbeddingConfig) と対称な値。
embedding:
  query_template: "Instruct: {task}\nQuery: {query}"
  doc_template: ""
  instructions:
    chat: "Given a user question, retrieve relevant passages that answer the query"
    create: "Given a code search query, retrieve relevant code snippets"
  # max_length は 1 入力シーケンスの推奨上限。context/batch/ubatch (サーバリソース) は
  # profile では設定せず config/schema 既定に委ねる (並列スロット分の KV が必要なため)。
  max_length: 8192
  # URL/コマンドリコールの sim 閾値 (embed 切替時 config.yaml tools.* へ転写)。Qwen3-Embedding
  # ── 実測較正 (2026-08-30) ─────────────────────────────────────
  # 3 モデル (LFM2.5-Embedding-350M / Qwen3-Embedding-0.6B / BGE-M3) を
  # **同一データ・同一手順** で測って導いた。測定対象はコード上の実際の
  # 比較対象に合わせてある:
  #
  #   url / executable_command … クエリ ↔ 保存済み話題
  #   note_link / conflict      … STM ノート ↔ ノート
  #   min_merge                 … 同上 (LLM 統合を行う上位の閾値)
  #   attribute_similarity      … 同一 (subject,predicate) 内のファクト object 同士
  #   cartridge_gate            … クエリ ↔ カートリッジ **重心**
  #
  # 閾値はゲートごとのコスト非対称性で選定した。外部作用を伴うもの
  # (URL 取得 / コマンド実行 / 誤マージ / 偽の競合) は **誤検出 0** を要求し、
  # コストが余分な検索・LLM 呼び出しに留まるものは取りこぼしを減らす側へ寄せた。
  #
  # データは合成セット (話題 8 / 正例 13-14 / 雑音 20、ノート対 10+12、
  # ファクト対 8+10、カートリッジ 3 x 6 チャンク)。実ストアではない点に注意。
  #
  # ⚠ 再較正でこの値を変えるときは scripts/tests/test_launch_llama_profiles.py の
  #   _CALIBRATED_THRESHOLDS も同じコミットで更新すること (更新漏れは同テストが検知する)。
  recall:
    # 5/14 通過・誤検出 0/20
    url_recall_min_score: 0.76
    # 10/13 通過・誤検出 0/20
    executable_command_recall_min_score: 0.6
  memory:
    # 10/10 通過・誤検出 0/12
    note_link_threshold: 0.35
    # 10/10 通過・誤検出 0/22
    conflict_similarity_threshold: 0.69
    # 10/10 通過・誤検出 0/22
    min_merge_similarity: 0.69
    # 7/8 通過・誤検出 0/10
    attribute_similarity_threshold: 0.55
  rag:
    # 9/9 通過・誤検出 0/8
    cartridge_gate_threshold: 0.49
