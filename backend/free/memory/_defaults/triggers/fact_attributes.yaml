# EvorefMem — ユーザーファクトの属性 subject 辞書
#
# 目的:
#   ``personal_fact`` / ``preference`` / ``emotion`` / ``opinion`` の subject を
#   属性単位 (``mem.personal.name`` / ``mem.preference.coding_style`` 等) に
#   分割する。設計書 f_02_memory_system.md §4.2 の subject 規約に対応。
#
# なぜ必要か (2026-07-25):
#   従来これらは一律 ``mem.personal.user`` 等の 1 subject にまとめられていた。
#   競合検出 (``semantic_conflict_resolver._detect_groups``) は
#   ``(subject, predicate)`` が同じで object が異なれば **類似度を見ずに**
#   競合と判定するため、「コメント方針」と「GPU 仕様」のように無関係な事実まで
#   同一事実の競合版と誤判定され、恒久 pending 化してチャットの競合セクションを
#   毎ターン汚染していた。
#
# 構成:
#   mode (chat)
#     └ fact_type (personal_fact / preference / emotion / opinion)
#         └ attribute_slug: [trigger, ...]
#
# マッチング規則 (note_builder.resolve_fact_attribute):
#   1. 入力テキストを NFKC + lowercase
#   2. 当該 fact_type の attribute を **YAML 記載順** に走査し、
#      trigger が 1 語でも部分一致した最初の attribute を採用する
#   3. どれにも一致しなければ ``None`` (呼出側が従来どおり "user" にフォールバック)
#
#   → 記載順が優先順位。具体的な属性 (machine_spec 等) を先に、
#     汎用的な属性 (other 寄り) を後ろに置くこと。
#
# attribute_slug の制約:
#   ``subject_ns._SAFE_PART_RE`` により **ASCII 英数字 / _ / -** のみ。
#   日本語スラグは ``SubjectNamespaceError`` になる。
#
# 粒度の指針:
#   細かすぎると「同じ属性の言い直し」が別 subject に分裂して真の競合を
#   取り逃す。逆に粗すぎると無関係な事実が競合扱いになる。
#   「ユーザーが後から言い直しうる単位」を 1 attribute とする。
#
# ユーザー上書き: ``local/triggers/fact_attributes.yaml`` に同名ファイルを置くと
# package 同梱 default に代えて読み込まれる (fact_triggers.yaml と同じ方針)。

chat:
  personal_fact:
    # 具体的・固有性の高いものを先に置く
    machine_spec:
      - gpu
      - cpu
      - vram
      - ram
      - メモリは
      - メモリが
      - 開発マシン
      - 開発環境
      - マシンは
      - スペック
      - ryzen
      - radeon
      - geforce
      - intel
      - core i
      - ssd
      - ストレージ
    birthday:
      # ``single_valued`` は付けない (name と同じ理由 — 「妻の誕生日は」等、
      # 他者の値がこのスロットへ落ちたときに本人の値を消してしまう)。
      triggers:
      - 誕生日
      - 生年月日
      - 何歳
      - 歳です
      - 才です
      - birthday
      - years old
    contact:
      - メールアドレス
      - 連絡先
      - 電話番号
      - 内線
      - email address
      - phone number
    family:
      - 家族
      - 妻
      - 夫
      - 息子
      - 娘
      - 子ども
      - 子供
      - 両親
      - my wife
      - my husband
      - my kids
    health:
      - 体調
      - 睡眠
      - 健康
      - 持病
      - アレルギー
      - 疲れやすい
    # 出身地は **現住所と独立した不変値**。同じ location スロットへ同居させて
    # いたため、「住んでいるのは横浜市です。生まれは福岡です。」から location
    # (横浜) だけが作られ、出身地のファクトが 1 件も残らなかった
    # (2026-08-29 ライブ監査 T21#6 / T26#6 で「記録に残っていないため確認でき
    # ていません」)。``生まれ`` はどのトリガにも無く、``出身`` は location に
    # 吸われていた。location より **前** に置く (単一マッチ API の優先順位)。
    origin:
      single_valued: true
      triggers:
      - 出身
      - 生まれは
      - 生まれ育
      - 地元
      - i'm from
      - i am from
    # 現住所。引っ越しで **上書きされる単値**。
    location:
      single_valued: true
      triggers:
      - 在住
      - 住んで
      - 住まい
      - 引っ越
      # 読み出し側の語彙。「私の勤務地と居住地をもう一度。」「私の出身地と
      # 居住地をもう一度。」がどの location トリガにも当たらず、属性免除が
      # 効かないままコサインのゲートで棄却されていた (2026-08-30 ライブ監査の
      # 検証 V4#2 / V4#3: 実機は「確認できていません」)。
      # ``住所`` は入れない — ``会社の住所`` が **単値の居住地を上書き** する
      # 側へ落ちる (work_location より前に評価されるため)。
      - 居住地
      # 「私の住所は？」— スロット名そのものが語彙に無かった
      # (2026-08-31 ライブ監査: location が live なのに免除されず落ちた)。
      - 住所
      - i live in
    # 勤務地は自宅とは別の値。location へ入れたままだと単値化で
    # 「住んでいる場所」を勤務地が上書きしてしまう。
    work_location:
      - 勤務地
      - 職場は
      - オフィスは
      # ``会社は`` は occupation ではなく **勤務先** を指す。occupation 側に
      # 置いていたため「会社は品川にあります。」が本業のスロットへ入り、
      # occupation は単値なので **正しい職種を supersede して消して** いた
      # (2026-08-30 ライブ監査、実ストアで確認)。work_location は多値なので
      # ここに置いても値を壊さない。YAML 記載順で occupation より前にある。
      - 会社は
      - 会社の所在
      - 会社の場所
    occupation:
      # 本業は 1 つなので、転職で旧職は無効になる。
      single_valued: true
      triggers:
      - 仕事は
      - 職業
      # 裸の ``勤務`` は ``勤務地`` に部分一致する。occupation を単値化した後は
      # 「勤務地は品川です」が **本業を supersede** してしまうため具体化する。
      - 勤務先
      - 勤務して
      - 勤めて
      - 働いて
      - 所属は
      - 部署
      - エンジニアです
      # 「それと、転職してデータエンジニアになりました。」が **どの属性にも
      # 一致せず** ファクトが 1 件も作られなかった (2026-08-29 ライブ監査 T26#2)。
      # 同じテーマの「札幌に引っ越しました」は location に落ちていたため、
      # 職業だけが旧値のまま残り、T28 で「ソフトウェアエンジニア」に戻った。
      - 転職
      - 就職
      - 退職
      - フリーランス
      - i work as
      - my job
      - my company
    schedule:
      - 予定
      - 締切
      - 期限
      - 会議
      - ミーティング
      # イベント登壇・発表の類。2026-08-25 ライブ監査で
      # 「来月の9月14日に大阪で技術カンファレンスの登壇があります。」と
      # 「登壇日は9月14日ではなく9月20日に変更になりました。」がどの trigger にも
      # 当たらず、登壇日が SemMem に 1 件も入らなかった。唯一の供給源が
      # アシスタントのセッション要約 (訂正前の 9月14日 を含む) になっていた。
      - 登壇
      - 発表
      - カンファレンス
      - セミナー
      - イベント
      - 日程
      - 開催
      - 予約
      - スケジュール
      - 来週
      - 来月
      - 明日まで
      - deadline
      - meeting
    policy:
      # 「私の方針は…」形式。personal_fact タグで拾われるが内容は作業方針。
      # preference.coding_style と重複しうるが、タグが片方しか立たないため両方に置く。
      - 方針
      - ルールは
      - 規約
      - コメントは
      - コメントを
      - 命名は
      - スタイルは
      - 進め方は
    # ペット (飼っているか / 名前 / 種類)。**name より前に置く** —
    # 「猫の名前は」は name の trigger「名前は」にも一致するため、後ろに置くと
    # name が先に取る。2026-08-25 ライブ監査の追調査: 「猫の名前はソラでは
    # なくルナでした。」が mem.personal.name (ユーザー本人の名前スロット) へ
    # 入り、「私の名前は小川浩之です。」と同一 subject で並んだ。injector の
    # slot collapse は (subject, predicate) 単位なので片方が必ず落ちる。
    #
    # **飼育の有無と名前を 1 スロットに束ねる**。別スロットにすると
    # 「犬を1匹飼っていて、名前はコタロウです。」(pet) と「犬の名前はコタロウ
    # ではなくハナでした。」(pet_name) が別 subject になり supersede されない。
    # 実機検証 (同日): 訂正後に想起して「コタロウ」が返った — object は発話
    # 全文なので pet 側が名前を語り続ける。同じスロットに入れば collapse で
    # 新しい方 (訂正) が勝つ。
    pet:
      - 猫の名前
      - 犬の名前
      - ペットの名前
      - うちの猫
      - うちの犬
      - 飼い猫
      - 飼い犬
      - 猫派
      - 犬派
      - ペット
      # 「飼って」だけだと「飼い始めました」「飼いたい」が漏れる。
      - 飼い
      - 飼って
      - 猫を
      - 犬を
      - 猫も
      - 犬も
    name:
      # このスロットは **ユーザー本人** の名前。「X の名前は」の X が一人称で
      # ないときは一致させない (AttributeSpec.requires_self_possessor)。
      # pet の語彙が漏れても、着地点が mem.personal.user になるだけで
      # 本人のスロットは汚れない — 語彙列挙は必ず漏れるので、漏れたときの
      # 失敗を安全側へ倒すのがこのフラグの役割。
      requires_self_possessor: true
      # ``single_valued`` は **付けない**。所有者ガードは trigger 直前の
      # 「<非一人称>の」しか見ないため、文をまたいだ暗黙の所有者を落とせない。
      # 実測 (2026-08-29): 「猫も1匹飼い始めました。名前はミルクです。」が
      # pet ではなく name に解決された。単値化するとペットの名前が
      # **本人の名前を supersede** してしまう。重複 live のままなら
      # injector の collapse が選ぶだけで、誤って消えることはない。
      triggers:
      - 名前は
      - 名前が
      - 名前を
      - と申します
      # 日本語の自己紹介で最も普通の形。これが無いため
      # 「私は小川宏之といいます。」から name のファクトが 1 件も作られず、
      # 「私の名前を覚えていますか。」に答えられなかった (2026-08-25 ライブ監査)。
      # 用語の定義 (「この現象を…といいます」) にも当たる語だが、属性辞書は
      # **personal_fact と既にタグ付けされたノート** にしか適用されない
      # (タグ付けは一人称の自己開示トリガが要る) ので、そちらへは波及しない。
      - といいます
      - と言います
      - と呼んで
      - my name
      - call me
    # 飲食物の好みは personal_fact タグでも拾われる (「私は紅茶派です」)。
    # 属性が無いと mem.personal.user へフォールバックし、飲み物と食べ物が
    # 同じスロットに同居して偽の競合になる (2026-08-16 ライブ監査)。
    # beverage を food より先に置く — 「コーヒーが好きな食べ物」のように
    # 両方の語が出る文では飲み物側を優先したい。
    beverage:
      - 飲み物
      - コーヒー
      - 珈琲
      - 紅茶
      - お茶
      - 緑茶
      - ビール
      - お酒
      - ワイン
      - ジュース
      - coffee
      - tea
    food:
      - 食べ物
      - 料理
      - 好きな味
      - ラーメン
      - 麺
      - パン
      - 肉
      - 魚
      - 野菜
      - 甘いもの
      - 辛いもの

  preference:
    language:
      - 日本語で
      - 英語で
      - 応答は
      - 回答は
      - 返答は
      - 出力は
      - in japanese
      - in english
      - respond in
    coding_style:
      - コメント
      - 命名
      - インデント
      - 型ヒント
      - docstring
      - フォーマッタ
      - コーディング規約
      - コードスタイル
      - naming
      - code style
    communication_style:
      - 簡潔
      - 冗長
      - 詳しく
      - 端的
      - ざっくり
      - 丁寧に
      - 箇条書き
      - concise
      - verbose
      - in detail
    # editor は tooling より **先** に置く。常用エディタは 1 つしか成立
    # しないが、tooling は OS / シェル / フレームワークを同居させる多値の
    # スロットなので、まとめると乗り換えても旧値が live で残る。
    #
    # 実インシデント (2026-08-31 ライブ監査 T02 → T20、実ストアで確認):
    # 「エディタは Vim です」→「やっぱり VSCode に乗り換えました」の後、
    # ``mem.preference.tooling`` に Vim と VSCode が **2 つとも live** で残り、
    # **新規セッションの「私が使っているエディタは何ですか？」に「Vimです。」**
    # と訂正前の値を返した。
    editor:
      single_valued: true
      triggers:
      - エディタ
      - vscode
      - vim
      - emacs
      - jetbrains
      - intellij
      - pycharm
      - neovim
      - editor
    tooling:
      - ターミナル
      - シェル
      - powershell
      - windows
      - linux
      - macos
      - フレームワーク
      - ライブラリは
    workflow:
      - テストは
      - レビュー
      - ブランチ
      - コミット
      - プルリク
      - ci
      - 進め方
      - 作業時間
    # hobby は beverage / food より **先** に置く。解決は「YAML 記載順の
    # 最初の部分一致」なので、属性名そのものを述べた文 (趣味は / 休日は /
    # 余暇) を、文中にたまたま現れる内容語 (コーヒー / ラーメン) より
    # 優先させる必要がある。順序が逆だと「趣味は登山とコーヒーの焙煎です。」
    # が ``コーヒー`` に先に当たって ``mem.preference.beverage`` になり、
    # 趣味として想起できない (2026-08-18 ライブ監査で実測)。
    hobby:
      - 趣味
      - 休日は
      - 余暇
      - hobby
    # personal_fact 側と同じ理由で飲み物と食べ物を分ける。飲み物を先に置く。
    beverage:
      - 飲み物
      - コーヒー
      - 珈琲
      - 紅茶
      - お茶
      - 緑茶
      - ビール
      - お酒
      - ワイン
      - ジュース
      - coffee
      - tea
    food:
      - 食べ物
      - 料理
      - 好きな味
      - ラーメン
      - 麺
      - パン
      - 肉
      - 魚
      - 野菜
      - 甘いもの
      - 辛いもの
    media:
      - 音楽
      - 映画
      - 本は
      - 読書
      - ゲームは

  emotion:
    workload:
      - 忙し
      - 疲れ
      - ストレス
      - 手一杯
      - 余裕がな
    frustration:
      - 困って
      - 苛立
      - もどかし
      - うまくいかな
      - 厄介
    anxiety:
      - 不安
      - 心配
      - 迷って
      - 悩んで
    satisfaction:
      - 嬉し
      - 楽し
      - 満足
      - 助かった
      - ありがた
    # 体調・睡眠まわりのつらさ。workload (仕事の忙しさ) とは別物なので分ける。
    # 実測 (2026-08-16、会話履歴 169 ターン): emotion のフォールバック 2 件が
    # どちらもこの系統だった (「夜更かしすると次の日つらい」「布団から出るのが
    # つらい」)。「つらい」は workload の語彙に無く、あっても意味が違う。
    wellbeing:
      - つらい
      - つらく
      - 眠
      - 寝不足
      - 夜更かし
      - 早起き
      - 体調
      - だる
      - しんど

  opinion:
    tech_stack:
      - 技術選定
      - 言語は
      - フレームワーク
      - ライブラリ
      - アーキテクチャ
      - 設計は
    process:
      - 進め方
      - 方針
      - 運用
      - 体制
      - ルール
    product:
      - 製品
      - サービス
      - 機能は
      - ui
      - ux
