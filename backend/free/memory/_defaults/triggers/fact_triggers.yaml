# EvorefMem — ChatNoteBuilder / CreateNoteBuilder 候補ファクト判定辞書
#
# 本ファイル: FACT_TRIGGERS の外部化 (config → YAML)
#
# 構成:
#   mode (chat | create)
#     └ fact_type (personal_fact / world_fact / preference / emotion / opinion /
#                  project / decision / commitment / task / create)
#         └ triggers: [str, ...]   # 部分一致、lowercase 化後に比較
#
# マッチング規則 (note_builder.candidate_fact_tags):
#   1. 入力テキストを ``str.lower()``
#   2. mode 対応セクションの各 fact_type の trigger 一覧に対し、
#      1 語でも ``in`` マッチした fact_type を候補タグとして返す
#   3. 複数 fact_type が当たった場合は全てを返す (重複なし)
#
# sleep-time Step 8 の Chat/CreateExtractor は ``candidate_fact_tags`` の
# 戻り値をそのまま利用するため、ここを拡張すると Extractor にも追随する。
#
# i18n: ja / en をフラットに混在させる。pin_triggers.yaml と同じ方針。
#
# ユーザー上書き: ``local/triggers/fact_triggers.yaml`` に同名ファイルを置くと
# package 同梱 default に代えて読み込まれる。

chat:
  personal_fact:
    - 私は
    - 僕は
    - 俺は
    - 自分は
    - うちの
    - 私の
    - 僕の
    - 俺の
    - "i am "
    - "i'm "
    - "my name"
    - "my favorite"
    # 主語省略の自己開示 (日本語では一人称を落とすのが常態)。上の一人称
    # 代名詞トリガだけでは「家族は妻と小学生の娘が一人です」「今は横浜市
    # 磯子区に住んでいます」「来月、船橋市に引っ越すことになりました」が
    # 全て候補にならず、SemMem に家族・居住・転居のファクトが 1 件も
    # 蓄積されない (2026-07-26 ライブ検証: 「うちの家族構成は?」に対し
    # 無関係な食べ物の好みが想起された)。誤検出を避けるため、依頼文や
    # 質問文では成立しない「断定の述語形」だけを採る。
    - 家族は
    - 妻は
    - 夫は
    - 住んでいます
    - 住んでいる
    - 住んでます
    - 引っ越します
    - 引っ越すことになりました
    - 引っ越しました
    - 勤めています
    - 勤務しています
    - 働いています
    # 訂正の**構文形**。訂正は必ず既存ファクトの更新なので、属性語彙に
    # 依存させてはいけない。実インシデント (2026-08-22 ライブ監査 2 回目):
    # 「猫の名前はミケではなくトラでした。」「職業も間違いでした。正しくは
    # ネットワークエンジニアです。」が候補タグ **0 件** で sleep-time Step 8 の
    # 抽出対象にすらならず、SemMem には訂正前の「ミケ」だけが残った。
    # 4 テーマ後の「私のペットの名前を全部教えてください。」に「猫はミケ」と
    # 訂正前の値で答えた。同じ会話の「札幌 → 仙台」は ``住んでいる`` が
    # personal_fact に当たったので通っており、差は属性語の有無だけだった。
    #
    # スロットの同定は ``is_correction`` の継承 (直前ターンの属性を継ぐ) が
    # 担うので、ここでは **候補に載せること** だけを目的にする。
    #
    # 裸の ``訂正します`` は入れない。``sleep.assertion_curator`` は
    # 「Step 8 が型付けできなかった取りこぼしだけ」を拾う契約で、候補タグが
    # 付くと curator の slug 継承 (world assertion 側) が働かなくなる。
    # 属性を伴う訂正形だけを採り、話題語を落とした訂正は curator に委ねる。
    - ではなく
    - じゃなくて
    - 間違いでした
    - 間違えました
    - 正しくは
    # 値の更新告知 (「職業も変わりました。今は構造設計士です。」)。訂正は
    # 誤りの指摘だけでなく「変わった」という申告でも起きる。
    - 変わりました
    - 変わった
    - 変更になりました
    - 変更しました
    - "actually it's"
    - "i meant"
    - "has changed"
  world_fact:
    - である
    - とは
    - と呼ばれる
    - 定義
    - は事実
    - " is a "
    - " are "
    - " was "
    - " were "
  preference:
    - 好き
    - 嫌い
    - お気に入り
    - いつも
    - よく使う
    - 苦手
    - "i like"
    - "i love"
    - "i hate"
    - "i prefer"
    # 趣味の自己開示。上の語は全て「好悪の述語」で、日本語で最も普通の
    # 言い方である「趣味は登山です」「休日は山に登っています」を 1 つも
    # 拾えない。``fact_attributes.yaml`` は ``chat.preference`` に
    # ``hobby: [趣味, 休日は, 余暇, hobby]`` を **既に定義している** のに、
    # そこへ到達させるトリガが無く、この属性は恒久的に空だった
    # (2026-08-18 ライブ監査: 「趣味は登山とコーヒーの焙煎です。」が候補タグ
    # 0 件のまま SemMem に入らず、再起動後の「趣味を覚えていますか？」に
    # 「具体的な情報がありません」と回答した)。トリガ側と属性側の語彙を
    # 揃える。質問文は ``_tag_evidence_is_question_only`` が、assistant 発話は
    # ChatExtractor のロールガードが別途弾く。
    - 趣味
    - 休日は
    - 余暇
    - hobby
    # 訂正の**構文形**。訂正は必ず既存ファクトの更新なので、属性語彙に
    # 依存させてはいけない。実インシデント (2026-08-22 ライブ監査 2 回目):
    # 「猫の名前はミケではなくトラでした。」「職業も間違いでした。正しくは
    # ネットワークエンジニアです。」が候補タグ **0 件** で sleep-time Step 8 の
    # 抽出対象にすらならず、SemMem には訂正前の「ミケ」だけが残った。
    # 4 テーマ後の「私のペットの名前を全部教えてください。」に「猫はミケ」と
    # 訂正前の値で答えた。同じ会話の「札幌 → 仙台」は ``住んでいる`` が
    # personal_fact に当たったので通っており、差は属性語の有無だけだった。
    #
    # スロットの同定は ``is_correction`` の継承 (直前ターンの属性を継ぐ) が
    # 担うので、ここでは **候補に載せること** だけを目的にする。
    #
    # 裸の ``訂正します`` は入れない。``sleep.assertion_curator`` は
    # 「Step 8 が型付けできなかった取りこぼしだけ」を拾う契約で、候補タグが
    # 付くと curator の slug 継承 (world assertion 側) が働かなくなる。
    # 属性を伴う訂正形だけを採り、話題語を落とした訂正は curator に委ねる。
    - ではなく
    - じゃなくて
    - 間違いでした
    - 間違えました
    - 正しくは
    # 値の更新告知 (「職業も変わりました。今は構造設計士です。」)。訂正は
    # 誤りの指摘だけでなく「変わった」という申告でも起きる。
    - 変わりました
    - 変わった
    - 変更になりました
    - 変更しました
    - "actually it's"
    - "i meant"
    - "has changed"
  emotion:
    - 嬉しい
    - 楽しい
    - 悲しい
    - 怒
    - つらい
    - 不安
    - 嫌だ
    - 最高
    - 最悪
    - "happy"
    - "sad"
    - "angry"
    - "excited"
    - "frustrated"
  opinion:
    - と思う
    - と考える
    - 気がする
    - に違いない
    - べきだ
    - "i think"
    - "i believe"
    - "in my opinion"
    - "i feel that"

create:
  project:
    - このプロジェクト
    - 本プロジェクト
    - このリポジトリ
    - 本リポジトリ
    - リポジトリ全体
    - evoref
    - "this project"
    - "this repo"
    - "this repository"
  decision:
    - 決めた
    - 決定
    - ことにした
    - 採用
    - 不採用
    - やめる
    - ロールバック
    - "we decided"
    - "decided to"
    - "going with"
    - "switching to"
  commitment:
    - 予定
    - つもり
    - までに
    - 締切
    - デッドライン
    - リリース予定
    - "deadline"
    - "by tomorrow"
    - "by next "
    - "will ship"
