    - "this repo"
    - "this repository"
  decision:
    - 決めた
    - 決定
    - ことにした
    - 採用
    - 不採用
    - やめる
    - ロールバック
    - "we decided"
    - "decided to"
    - "going with"
    - "switching to"
  commitment:
    - 予定
    - つもり
    - までに
    - 締切
    - デッドライン
    - リリース予定
    - "deadline"
    - "by tomorrow"
    - "by next "
    - "will ship"
  task:
    - 実装して
    - 修正して
    - 直して
    - 追加して
    - 作って
    - 教えて
    - 確認して
    - レビュー
    - やって
    - テストして
    - "please implement"
    - "fix the"
    - "add the"
    - "refactor"
  coding:
    - "python"
    - "javascript"
    - "typescript"
    - "class "
    - "def "
    - "import "
    - "function"
    - バグ
    - リファクタ
    - ユニットテスト
    - 型エラー
    - "stack trace"
    - "exception"
    - "traceback"
